
  upstream app_server {
    # fail_timeout=0 means we always retry an upstream even if it failed
    # to return a good HTTP response

    # for UNIX domain socket setups
    server unix:/run/gunicorn.sock fail_timeout=0;
    #proxy_pass http://unix:/tmp/gunicorn.sock;

    # for a TCP configuration
    # server 192.168.0.7:8000 fail_timeout=0;
  }

  # limit for login bruteforce (500ms)
  limit_req_zone $binary_remote_addr zone=brute:1m rate=2r/s; 

  server {
    # use 'listen 80 deferred;' for Linux
    # use 'listen 80 accept_filter=httpready;' for FreeBSD
    listen 443 ssl;
    client_max_body_size 4G;

    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # set the correct host(s) for your site
    #server_name example.com www.example.com;

    keepalive_timeout 5;

    # path for static files
    root /opt/4125doctor/doctors_office_4125/static;

    location / {
      # checks for static file, if not found proxy to app
      try_files $uri @proxy_to_app;
    }

    location /static/ {
      alias /opt/4125doctor/staticfiles/;
    }

    # user media
    location /media/ {
      alias /opt/4125doctor/media/;
      # caching
      expires 30d;

      try_files $uri $uri/ =404;
    }

    location @proxy_to_app {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $http_host;
      # we don't want nginx trying to do something clever with
      # redirects, we set the Host: header above already.
      proxy_redirect off;
      proxy_pass http://app_server;
    }

    error_page 500 502 503 504 /500.html;
    location = /500.html {
      root /path/to/app/current/public;
    }

    # brute force protection for acccounts
    location /accounts/ {
      # limit requests using zone, burst queue of 5 (2.5s)
      limit_req zone=brute burst=5; 

      #i think?
      try_files $uri @proxy_to_app; 
    }

  }
